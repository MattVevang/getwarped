name: Dependency Updates

on:
  schedule:
    # Run weekly on Monday at 9 AM UTC
    - cron: '0 9 * * 1'
  workflow_dispatch: # Allow manual trigger

jobs:
  update-dependencies:
    name: Update Dependencies
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Check for outdated packages
      run: npm outdated || true

    - name: Update dependencies
      run: |
        npm update
        npm audit fix --force

    - name: Run tests after updates
      run: |
        npm run test:unit
        npm run test:integration
      continue-on-error: true

    - name: Create Pull Request
      uses: peter-evans/create-pull-request@v5
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        commit-message: 'chore: update dependencies'
        title: 'Automated Dependency Updates'
        body: |
          This PR contains automated dependency updates.
          
          ## Changes
          - Updated npm dependencies to latest compatible versions
          - Applied security fixes via npm audit
          
          ## Testing
          - Unit tests: Run `npm run test:unit`
          - Integration tests: Run `npm run test:integration`
          - E2E tests: Run `npm run test:e2e`
          
          Please review the changes and ensure all tests pass before merging.
        branch: automated-dependency-updates
        delete-branch: true

  renovate:
    name: Renovate Dependency Updates
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Self-hosted Renovate
      uses: renovatebot/github-action@v39.2.4
      with:
        configurationFile: .github/renovate.json
        token: ${{ secrets.RENOVATE_TOKEN }}

  security-updates:
    name: Security Updates
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Check for security vulnerabilities
      run: npm audit --audit-level moderate

    - name: Apply security fixes
      run: npm audit fix

    - name: Run tests after security fixes
      run: npm test

    - name: Create Security Fix PR
      uses: peter-evans/create-pull-request@v5
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        commit-message: 'security: apply automated security fixes'
        title: 'Security: Automated Security Fixes'
        body: |
          This PR contains automated security fixes for npm dependencies.
          
          ## Security Fixes Applied
          These changes were generated by `npm audit fix` to address security vulnerabilities.
          
          ## Testing
          All existing tests have been run to ensure compatibility.
          
          **This is a high-priority security update and should be reviewed promptly.**
        branch: automated-security-fixes
        delete-branch: true
        labels: |
          security
          dependencies
          automated